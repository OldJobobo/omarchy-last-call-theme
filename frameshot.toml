version = 1
name = "Last Call night shift"
theme_name = "Last Call"
canvas = [2560, 1440]
wallpaper = "{theme}/backgrounds/01-closing-hour.jpg"
workspace = "90"
monitor = "focused"
focus = "btop"
settle_seconds = 3.0
terminal = "foot"

# A broad code surface establishes the cool working canvas.
[[windows]]
id = "nvim"
cwd = "{templates}"
command = ["nvim", "rust-preview-demo.rs", "+normal! 12Gzz"]
rect = [90, 90, 1120, 700]

# Telemetry is the active signal panel and showcases the authored btop ramps.
[[windows]]
id = "btop"
cwd = "{theme}"
command = ["btop"]
rect = [1350, 90, 1130, 650]

# A clean shell proof: both ANSI rows, the MOTD card, and a restrained prompt.
[[windows]]
id = "motd"
cwd = "{theme}"
command = ["bash", "--norc", "-i", "-c", "source \"$HOME/.bashrc\" >/dev/null 2>&1; clear; _ansi_palette; _sysinfo; printf '\\n\\033[1;36momarchy-last-call-theme\\033[0m  \\033[2;37mnight shift\\033[0m\\n\\033[1;36m❯\\033[0m '; exec sleep infinity"]
rect = [110, 815, 820, 380]

# Cava provides the low, wide audio trace anchoring the composition.
[[windows]]
id = "cava"
cwd = "{theme}"
command = ["bash", "-lc", "cava; exec bash"]
rect = [470, 1210, 1720, 170]

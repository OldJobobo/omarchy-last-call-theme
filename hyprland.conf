# Last Call — Cold Line / Warm Signal
# Omarchy 3.8 compatibility mirror. Layout and gaps remain user-owned.

$activeBorderColor = rgb(00C6C2) rgb(E0F5F2) 45deg
$inactiveBorderColor = rgba(2C515888)
$lockedBorderColor = rgb(C5C15A)
$shadowColor = rgba(010506CC)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = $lockedBorderColor
    col.border_locked_inactive = $inactiveBorderColor
}

decoration {
    rounding = 2
    rounding_power = 2

    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.03
        contrast = 0.92
        brightness = 0.86
        vibrancy = 0.08
        vibrancy_darkness = 0.74
        ignore_opacity = true
    }

    shadow {
        enabled = true
        color = $shadowColor
        range = 12
        render_power = 3
    }
}

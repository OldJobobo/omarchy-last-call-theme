<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d20"/>
      <stop offset="0.62" stop-color="#0b1d20"/>
      <stop offset="1" stop-color="#1E4147"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C6C2" stop-opacity="0.55"/>
      <stop offset="0.58" stop-color="#2C5158" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#1E4147" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C6C2"/>
      <stop offset="0.66" stop-color="#E0F5F2"/>
      <stop offset="1" stop-color="#C5C15A"/>
    </linearGradient>
    <radialGradient id="boothLight" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#E0F5F2" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#00C6C2" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#00C6C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C5158" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00C6C2" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="rain" width="62" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <path d="M10 2V28 M38 34V64" stroke="#00C6C2" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1600" height="1000" fill="#0b1d20"/>
  <rect x="24" y="24" width="1552" height="952" fill="url(#night)" stroke="#2C5158" stroke-width="2"/>
  <path d="M24 882H1576" stroke="url(#signal)" stroke-width="4"/>

  <!-- Left: illustrated source world -->
  <g>
    <rect x="24" y="24" width="640" height="858" fill="#0b1d20"/>
    <rect x="24" y="24" width="640" height="858" fill="url(#rain)"/>
    <circle cx="350" cy="412" r="280" fill="url(#boothLight)"/>

    <!-- wires -->
    <path d="M24 142 C170 102 340 164 664 74" fill="none" stroke="#2C5158" stroke-width="3"/>
    <path d="M24 190 C210 128 382 228 664 122" fill="none" stroke="#2C5158" stroke-width="2"/>
    <circle cx="522" cy="116" r="5" fill="#ED634C"/>
    <circle cx="522" cy="116" r="16" fill="#ED634C" opacity="0.22" filter="url(#smallGlow)"/>

    <!-- alley masses -->
    <path d="M24 352 L190 280 L190 733 L24 794 Z" fill="#1E4147" stroke="#2C5158" stroke-width="2"/>
    <path d="M478 250 L664 202 L664 735 L478 700 Z" fill="#1E4147" stroke="#2C5158" stroke-width="2"/>
    <rect x="52" y="398" width="104" height="30" fill="#2C5158"/>
    <rect x="515" y="336" width="118" height="36" fill="#2C5158"/>
    <path d="M65 412H145 M528 350H620" stroke="#719398" stroke-opacity="0.3" stroke-width="3"/>

    <!-- booth glow -->
    <rect x="214" y="230" width="242" height="516" fill="#00C6C2" opacity="0.12" filter="url(#softGlow)"/>
    <rect x="224" y="222" width="224" height="524" fill="#0b1d20" stroke="url(#signal)" stroke-width="8"/>
    <rect x="244" y="248" width="184" height="470" fill="url(#glass)" stroke="#00C6C2" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M336 248V718 M244 432H428" stroke="#00C6C2" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="270" y="278" width="132" height="40" fill="#E0F5F2" opacity="0.82"/>
    <text x="336" y="304" text-anchor="middle" fill="#0b1d20" font-family="ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="3">LAST CALL</text>

    <!-- telephone -->
    <rect x="302" y="420" width="68" height="104" rx="3" fill="#1E4147" stroke="#C5C15A" stroke-opacity="0.65"/>
    <path d="M314 438 C310 414 362 414 358 438" fill="none" stroke="#E0F5F2" stroke-width="8" stroke-linecap="round"/>
    <circle cx="336" cy="480" r="18" fill="#2C5158" stroke="#719398"/>
    <path d="M351 517 C388 548 364 596 397 630" fill="none" stroke="#2C5158" stroke-width="4"/>

    <!-- fish -->
    <g fill="#D07A3F">
      <path d="M282 370 C302 350 330 354 343 370 C327 388 301 391 282 370 M282 370 L262 354 L263 386 Z"/>
      <path d="M357 350 C374 334 398 337 410 351 C396 367 374 368 357 350 M357 350 L342 338 L342 363 Z" opacity="0.88"/>
      <path d="M352 581 C369 565 393 568 405 582 C391 598 369 600 352 581 M352 581 L337 568 L337 594 Z" opacity="0.75"/>
      <path d="M270 624 C286 608 309 610 321 624 C307 640 286 642 270 624 M270 624 L255 611 L255 637 Z" opacity="0.65"/>
    </g>

    <!-- wet street -->
    <path d="M24 720 C190 690 488 694 664 734 L664 882 L24 882 Z" fill="url(#wet)"/>
    <path d="M214 746 L456 746 L528 882 L146 882 Z" fill="#00C6C2" opacity="0.07"/>
    <path d="M270 752 L402 752 L438 882 L232 882 Z" fill="#E0F5F2" opacity="0.06"/>
    <path d="M24 814 C170 780 420 808 664 776" fill="none" stroke="#719398" stroke-opacity="0.16" stroke-width="3"/>

    <text x="64" y="84" fill="#719398" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3">OMARCHY 4.0 / REDESIGN STUDY</text>
  </g>

  <!-- Right: proposal card -->
  <g transform="translate(712 0)">
    <text x="0" y="105" fill="#00C6C2" font-family="ui-monospace, monospace" font-size="16" font-weight="700" letter-spacing="4">OMARCHY SEMANTICS / BASE24 LOGIC</text>
    <text x="0" y="166" fill="#C8E3E2" font-family="Inter, ui-sans-serif, sans-serif" font-size="54" font-weight="650" letter-spacing="-2">Cold Line</text>
    <text x="0" y="222" fill="#C8E3E2" font-family="Inter, ui-sans-serif, sans-serif" font-size="54" font-weight="650" letter-spacing="-2">/ Warm Signal</text>
    <rect x="0" y="253" width="720" height="3" fill="url(#signal)"/>

    <text x="0" y="304" fill="#94B3B5" font-family="Inter, ui-sans-serif, sans-serif" font-size="19">
      <tspan x="0" dy="0">Twenty-four unique roles. One rain-cold system.</tspan>
      <tspan x="0" dy="29">Canvas base00 · surface base01 · select base02</tspan>
    </text>

    <!-- canonical Base24 neutral ramp -->
    <text x="0" y="397" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="3">BASE24 NEUTRAL RAMP</text>
    <g transform="translate(0 420)">
      <g><rect width="76" height="78" fill="#0b1d20" stroke="#2C5158"/><text x="4" y="98" fill="#719398" font-family="ui-monospace, monospace" font-size="10">BASE00</text><text x="4" y="113" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#0b1d20</text></g>
      <g transform="translate(88 0)"><rect width="76" height="78" fill="#1E4147" stroke="#2C5158"/><text x="4" y="98" fill="#719398" font-family="ui-monospace, monospace" font-size="10">BASE01</text><text x="4" y="113" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#1E4147</text></g>
      <g transform="translate(176 0)"><rect width="76" height="78" fill="#42686F"/><text x="4" y="98" fill="#719398" font-family="ui-monospace, monospace" font-size="10">BASE02</text><text x="4" y="113" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#42686F</text></g>
      <g transform="translate(264 0)"><rect width="76" height="78" fill="#719398"/><text x="4" y="98" fill="#C8E3E2" font-family="ui-monospace, monospace" font-size="10">BASE03</text><text x="4" y="113" fill="#C8E3E2" font-family="ui-monospace, monospace" font-size="9">#719398</text></g>
      <g transform="translate(352 0)"><rect width="76" height="78" fill="#82A3A6"/><text x="4" y="98" fill="#719398" font-family="ui-monospace, monospace" font-size="10">BASE04</text><text x="4" y="113" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#82A3A6</text></g>
      <g transform="translate(440 0)"><rect width="76" height="78" fill="#94B3B5"/><text x="4" y="98" fill="#719398" font-family="ui-monospace, monospace" font-size="10">BASE05</text><text x="4" y="113" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#94B3B5</text></g>
      <g transform="translate(528 0)"><rect width="76" height="78" fill="#C8E3E2"/><text x="4" y="98" fill="#719398" font-family="ui-monospace, monospace" font-size="10">BASE06</text><text x="4" y="113" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#C8E3E2</text></g>
      <g transform="translate(616 0)"><rect width="76" height="78" fill="#E0F5F2"/><text x="4" y="98" fill="#719398" font-family="ui-monospace, monospace" font-size="10">BASE07</text><text x="4" y="113" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#E0F5F2</text></g>
    </g>

    <!-- canonical Base24 accents -->
    <text x="0" y="580" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="3">BASE24 SEMANTIC ACCENTS</text>
    <g transform="translate(0 604)">
      <g><circle cx="27" cy="27" r="27" fill="#ED634C"/><text x="0" y="76" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="10">RED</text><text x="0" y="91" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#ED634C</text></g>
      <g transform="translate(88 0)"><circle cx="27" cy="27" r="27" fill="#D07A3F"/><text x="0" y="76" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="10">ORANGE</text><text x="0" y="91" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#D07A3F</text></g>
      <g transform="translate(176 0)"><circle cx="27" cy="27" r="27" fill="#C5C15A"/><text x="0" y="76" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="10">YELLOW</text><text x="0" y="91" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#C5C15A</text></g>
      <g transform="translate(264 0)"><circle cx="27" cy="27" r="27" fill="#58AD73"/><text x="0" y="76" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="10">GREEN</text><text x="0" y="91" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#58AD73</text></g>
      <g transform="translate(352 0)"><circle cx="27" cy="27" r="27" fill="#00C6C2"/><text x="0" y="76" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="10">CYAN</text><text x="0" y="91" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#00C6C2</text></g>
      <g transform="translate(440 0)"><circle cx="27" cy="27" r="27" fill="#668CA9"/><text x="0" y="76" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="10">BLUE</text><text x="0" y="91" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#668CA9</text></g>
      <g transform="translate(528 0)"><circle cx="27" cy="27" r="27" fill="#9C8499"/><text x="0" y="76" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="10">MAGENTA</text><text x="0" y="91" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#9C8499</text></g>
      <g transform="translate(616 0)"><circle cx="27" cy="27" r="27" fill="#967D6D"/><text x="0" y="76" fill="#94B3B5" font-family="ui-monospace, monospace" font-size="10">BROWN</text><text x="0" y="91" fill="#719398" font-family="ui-monospace, monospace" font-size="9">#967D6D</text></g>
    </g>

    <!-- hand-authored system notes -->
    <g transform="translate(0 750)">
      <rect width="330" height="110" fill="#1E4147" stroke="#2C5158"/>
      <text x="20" y="31" fill="#94B3B5" font-family="Inter, ui-sans-serif, sans-serif" font-size="17" font-weight="600">Base24 roles / hand-built values</text>
      <text x="20" y="57" fill="#719398" font-family="Inter, ui-sans-serif, sans-serif" font-size="14">Foreground #94B3B5 · muted #719398</text>
      <text x="20" y="83" fill="#719398" font-family="Inter, ui-sans-serif, sans-serif" font-size="14">Selection #42686F · canvas #0b1d20</text>
      <g transform="translate(362 4)">
        <text x="0" y="17" fill="#00C6C2" font-family="ui-monospace, monospace" font-size="12" font-weight="700">01</text>
        <text x="38" y="17" fill="#94B3B5" font-family="Inter, ui-sans-serif, sans-serif" font-size="14">24 unique authored slots</text>
        <text x="0" y="47" fill="#00C6C2" font-family="ui-monospace, monospace" font-size="12" font-weight="700">02</text>
        <text x="38" y="47" fill="#94B3B5" font-family="Inter, ui-sans-serif, sans-serif" font-size="14">Semantic and ANSI mappings</text>
        <text x="0" y="77" fill="#00C6C2" font-family="ui-monospace, monospace" font-size="12" font-weight="700">03</text>
        <text x="38" y="77" fill="#94B3B5" font-family="Inter, ui-sans-serif, sans-serif" font-size="14">Readable muted color system</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="64" y="937" fill="#719398" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">LAST CALL / PALETTE SYSTEM</text>
  <text x="1536" y="937" text-anchor="end" fill="#C5C15A" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">COLD AMBIENT — WARM PRACTICAL</text>
</svg>
